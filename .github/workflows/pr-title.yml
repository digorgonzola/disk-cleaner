name: PR title

# PRs are squash-merged with the title as the commit subject, and release-please reads
# that commit for the version and the changelog. A title that is not a Conventional
# Commit drops that change from the release without a warning.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    # The check name that required-checks.yml waits for.
    name: PR title
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      # The title goes through env, never into the script, so a title cannot inject shell.
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=PR title::'$TITLE' is not a Conventional Commit, e.g. 'feat: add a cache rule' or 'fix(ui): keep the selection'."
            exit 1
          fi
