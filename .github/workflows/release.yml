name: Release

# A v* tag on main builds the universal app and attaches the zip and its SHA-256 to the
# tag's GitHub release. release-please.yml makes the tag and the release when the release
# PR is merged. A manual run builds only, as a check; it publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write # gh release upload
    env:
      # A manual run on a tag only builds, too.
      IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from the tag and the build number from the commit count.
          fetch-depth: 0
          persist-credentials: false
      - name: Only from main
        if: env.IS_TAG == 'true'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Test
        run: make test
      - name: Build and pack
        run: scripts/build-app.sh --zip
      - name: Attach to the GitHub release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag pushed by hand has no release yet; release-please's release keeps its notes.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber build/DiskCleaner-*.zip build/DiskCleaner-*.zip.sha256
